[sdl]
# Legacy/CRT baseline. Managed [pidos] monitor profiles override video at startup.
fullscreen=true
# Follow the DOS video mode: the initial 80x25 VGA prompt is 720x400.
# BOOT cmdline.txt requests the matching 70 Hz HDMI mode.
fullresolution=original
output=surface
videodriver=kmsdrm
waitonerror=false
# Windows uses relative PS/2 motion rather than DOS INT 33h positioning.
autolock=true
[dosbox]
machine=svga_s3
memsize=16
synchronize time=true
[cpu]
integration device=true
cputype=pentium
core=dynamic_rec
cycles=fixed 64180
[render]
# Keep the VGA raster unchanged and request its resolution from SDL2/KMS.
char9=true
aspect=false
scaler=none
modeswitch=true
[voodoo]
voodoo_card=software
voodoo_maxmem=true
glide=false
[mixer]
rate=48000
blocksize=1024
prebuffer=30
[sblaster]
sbtype=sbpro2
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
cms=off
[gus]
gus=false
gustype=classic
gusbase=240
gusirq=5
gusdma=3
gusmemsize=1024
ultradir=C:\ULTRASND
[speaker]
pcspeaker=true
tandy=off
[midi]
mpu401=intelligent
mpubase=330
mpuirq=-1
mididevice=synth
midiconfig=/dosdata/SYSTEM/MIDI/SC55.SF2
samplerate=48000
[dos]
# Built-in memory managers; PIDOSCFG's Memory page can disable either one.
xms=true
ems=true
# Spanish keyboard (DOSBox-X layout code: sp).
keyboardlayout=sp
# Allow long filenames for DOS applications that support them.
lfn=true
[config]
# DOS country controls date/time and number formats.
# Default: 34 (Spain). Example: 1 (United States).
country=34

[joystick]
# Stable DOS gameport: two conventional joysticks, including late connections.
joysticktype=2axis
timed=true
autofire=false

# Networking is compiled in; enable/configure it in PIDOSCFG's Network tab.
[ipx]
ipx=false
[ne2000]
ne2000=false
backend=slirp
nicbase=300
nicirq=10
macaddr=random
[ethernet, pcap]
realnic=eth0
[ethernet, slirp]
tcp_port_forwards=
udp_port_forwards=
